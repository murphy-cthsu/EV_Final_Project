# D-NeRF: standup (humanoid standing up from prone -> highly articulated motion)
# Strong full-body articulation through a wide motion range; tests whether
# curriculum unlocks late-stage fine motion correctly.

scene:
  name: standup
  dataset_root: data/dnerf/standup
  type: dnerf_synthetic
  fps: 30

vgm:
  backend: sv4d2
  num_frames: 60
  input_frame_index: 0
  cfg_scale: 7.5

articulation:
  lambda_intra: 1.0
  lambda_inter: 0.12      # slightly more inter-slack for wide-range motion
  static_label: -1
  enabled: true
  sam2:
    hierarchical: true
    max_parts: 12
    confidence_threshold: 0.5

frequency_curriculum:
  num_bands: 6
  # Wide-range motion needs more frequency capacity later
  milestones: [0, 4000, 10000]
  k_at_milestone: [2, 4, 6]
  enabled: true

gating:
  alpha0: 1.0
  ema_momentum: 0.99
  eps: 1.0e-6
  enabled: true

rest_state:
  eta: 0.0005             # slightly less anchor for wide-range motion
  enabled: true

loss_weights:
  photometric: 1.0
  arap: 1.0
  rest_state: 1.0

training:
  iterations: 30000
  batch_frames: 4
  log_every: 100
  warm_up: 3000

eval:
  novel_view_split: holdout
  novel_time_split: holdout
  metrics: [psnr, ssim, lpips, inter_part_angular_consistency, floater_count]
  inter_part_pair_strategy: spatial_proximity

# D-NeRF: jumpingjacks (articulated, primary headline scene)
# Articulated parts: torso, head, upper arms (L/R), forearms (L/R), thighs (L/R), shins (L/R)
# Expected SAM 2 part count: 5-9 depending on hierarchical level.

scene:
  name: jumpingjacks
  dataset_root: data/dnerf/jumpingjacks
  type: dnerf_synthetic
  fps: 30
  num_train_frames: 100   # D-NeRF's standard split
  num_test_frames: 20

# Single-image input + VGM front-end
vgm:
  backend: sv4d2          # primary; falls back to wan22 if blocked
  num_frames: 60          # SV4D 2.0 multi-view frame budget
  input_frame_index: 0    # use D-NeRF's first frame as static input
  cfg_scale: 7.5

# Slightly stronger joint slack for highly articulated full-body motion
articulation:
  lambda_intra: 1.0
  lambda_inter: 0.10
  static_label: -1
  enabled: true
  # SAM 2 part-prompting strategy
  sam2:
    hierarchical: true
    max_parts: 12
    confidence_threshold: 0.5

# D-NeRF clips are short -> pull milestones inward
frequency_curriculum:
  num_bands: 6
  milestones: [0, 3000, 8000]
  k_at_milestone: [2, 4, 6]
  enabled: true

gating:
  alpha0: 1.0
  ema_momentum: 0.99
  eps: 1.0e-6
  enabled: true

rest_state:
  eta: 0.001
  enabled: true

loss_weights:
  photometric: 1.0
  arap: 1.0
  rest_state: 1.0

training:
  iterations: 30000
  batch_frames: 4
  log_every: 100
  warm_up: 3000

# Evaluation
eval:
  novel_view_split: holdout    # D-NeRF's test cameras
  novel_time_split: holdout
  metrics:
    - psnr
    - ssim
    - lpips
    - inter_part_angular_consistency
    - floater_count
  inter_part_pair_strategy: spatial_proximity   # no GT skeleton for D-NeRF

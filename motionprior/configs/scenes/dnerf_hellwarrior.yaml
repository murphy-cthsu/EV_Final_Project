# D-NeRF: hellwarrior (articulated humanoid with weapon -> 6-10 parts)

scene:
  name: hellwarrior
  dataset_root: data/dnerf/hellwarrior
  type: dnerf_synthetic
  fps: 30

vgm:
  backend: sv4d2
  num_frames: 60
  input_frame_index: 0
  cfg_scale: 7.5

articulation:
  lambda_intra: 1.0
  lambda_inter: 0.08
  static_label: -1
  enabled: true
  sam2:
    hierarchical: true
    max_parts: 10
    confidence_threshold: 0.5

frequency_curriculum:
  num_bands: 6
  milestones: [0, 3000, 8000]
  k_at_milestone: [2, 4, 6]
  enabled: true

gating:
  alpha0: 1.0
  ema_momentum: 0.99
  eps: 1.0e-6
  enabled: true

rest_state:
  eta: 0.001
  enabled: true

loss_weights:
  photometric: 1.0
  arap: 1.0
  rest_state: 1.0

training:
  iterations: 30000
  batch_frames: 4
  log_every: 100
  warm_up: 3000

eval:
  novel_view_split: holdout
  novel_time_split: holdout
  metrics: [psnr, ssim, lpips, inter_part_angular_consistency, floater_count]
  inter_part_pair_strategy: spatial_proximity
